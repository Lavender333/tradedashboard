name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build market snapshot
        env:
          MES_DATA_PROVIDER: yahoo
          YAHOO_SYMBOL: MES=F
        run: python scripts/build_pages_snapshot.py

      - name: Build template automation snapshot
        env:
          TEMPLATE_DATA_PROVIDER: webull
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_ES_SYMBOL: ${{ vars.WEBULL_ES_SYMBOL }}
          WEBULL_ZB_SYMBOL: ${{ vars.WEBULL_ZB_SYMBOL }}
          ALLOW_YAHOO_FALLBACK: "true"
        run: python scripts/build_template_snapshot.py

      - name: Prepare static site
        run: |
          mkdir -p dist/data
          cp index.html trade-board.html trading-template.html trading-template-es.html trading-template-zb.html market-selector.js market-data-client.js .nojekyll dist/
          cp -R assets dist/
          cp data/*.json data/*.js dist/data/

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
