name = "lavender-schwab-market-data"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
SCHWAB_CALLBACK_URL = "https://api.thetruelavender.online/schwab/callback"
SCHWAB_ES_SYMBOL = "/ES"
SCHWAB_ZB_SYMBOL = "/ZB"
ALLOWED_ORIGINS = "https://lavender333.github.io,http://localhost:8000,http://127.0.0.1:8000"

# Create a KV namespace, then replace this placeholder before deployment:
# npx wrangler kv namespace create SCHWAB_TOKENS
[[kv_namespaces]]
binding = "SCHWAB_TOKENS"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"
